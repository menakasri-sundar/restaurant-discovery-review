<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | FoodFinder</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">
            🍽️ FoodFinder
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html">Restaurants</a>
            <a href="index.html">Reviews</a>
            <a href="#">About</a>
        </nav>

    </header>


    <main class="login-page">

        <div class="login-container">

            <h1>Create Account</h1>

            <p>
                Join FoodFinder and share your restaurant experiences.
            </p>


            <form id="signupForm">

                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >


                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 FoodFinder | Restaurant Discovery & Review
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
