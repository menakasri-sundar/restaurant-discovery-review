<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | FoodFinder</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">
            🍽️ FoodFinder
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html">Restaurants</a>
            <a href="index.html">Reviews</a>
            <a href="#">About</a>
        </nav>

    </header>


    <main class="login-page">

        <div class="login-container">

            <h1>Welcome Back 👋</h1>

            <p>
                Login to discover restaurants and share your reviews.
            </p>


            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 FoodFinder | Restaurant Discovery & Review
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
